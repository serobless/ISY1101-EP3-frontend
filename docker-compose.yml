# Named volume no aplica aquí (sin estado persistente).
# Las URLs de los backends se pasan como build args porque Vite las
# embebe en el JS estático, no son variables de runtime.
# ojo: cambiar estas URLs por las mías antes de levantar local.

services:
  front:
    build:
      context: .
      args:
        VITE_API_VENTAS_URL: http://localhost:8080
        VITE_API_DESPACHOS_URL: http://localhost:8081
    ports:
      - "8080:8080"
    restart: unless-stopped
